name: Java CI with Maven (Multi-OS)

on: [push]

jobs:
  build:
    strategy:
      matrix:
        # Đây là phần trọng tâm của Bài 4: Chạy trên cả Linux và Windows
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build and Test Bai01
        run: mvn -B test --file Bai01/pom.xml

      - name: Checkstyle Bai02
        run: mvn -B checkstyle:check --file Bai02/pom.xml